name: Build Koolaid Man

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (VST3 + Standalone)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -A x64   # newest installed Visual Studio
      - name: Build
        run: cmake --build build --config Release --target KoolaidMan_VST3 KoolaidMan_Standalone --parallel
      - name: Validate VST3 with pluginval (industry-standard plug-in tests)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $p = Start-Process -FilePath .\pluginval\pluginval.exe -ArgumentList '--strictness-level','8','--validate-in-process','--timeout-ms','900000','--output-dir','pluginval-logs','--validate','"build\KoolaidMan_artefacts\Release\VST3\Koolaid Man.vst3"' -NoNewWindow -Wait -PassThru
          Get-ChildItem pluginval-logs -Recurse -Filter *.txt | ForEach-Object { Get-Content $_.FullName -Tail 60 }
          exit $p.ExitCode
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse "build/KoolaidMan_artefacts/Release/VST3/Koolaid Man.vst3" "dist/Koolaid Man.vst3"
          Copy-Item "build/KoolaidMan_artefacts/Release/Standalone/Koolaid Man.exe" "dist/Koolaid Man.exe"
          Copy-Item "docs/INSTALL-WINDOWS.txt" "dist/INSTALL.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: KoolaidMan-Windows
          path: dist
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          & $iscc "/DSourceDir=$PWD\dist" "/DAppVersion=1.0.${{ github.run_number }}" installer\KoolaidMan.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: KoolaidMan-Windows-Installer
          path: installer/Output/KoolaidMan-Setup.exe

  macos:
    name: macOS (VST3 + AU + Standalone, universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --target KoolaidMan_VST3 KoolaidMan_AU KoolaidMan_Standalone -- -quiet
      - name: Validate the Audio Unit with auval (Apple's validator)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/KoolaidMan_artefacts/Release/AU/Koolaid Man.component" ~/Library/Audio/Plug-Ins/Components/
          codesign --force --deep -s - ~/Library/Audio/Plug-Ins/Components/"Koolaid Man.component"
          killall -9 AudioComponentRegistrar || true
          auval -a | grep -i "Kool" || true
          auval -strict -v aufx KmBd Kool
      - name: Sign (ad-hoc) and package
        run: |
          mkdir -p dist
          cp -R "build/KoolaidMan_artefacts/Release/VST3/Koolaid Man.vst3" dist/
          cp -R "build/KoolaidMan_artefacts/Release/AU/Koolaid Man.component" dist/
          cp -R "build/KoolaidMan_artefacts/Release/Standalone/Koolaid Man.app" dist/
          for b in dist/*.vst3 dist/*.component dist/*.app; do codesign --force --deep -s - "$b"; done
          cp docs/INSTALL-MAC.txt dist/INSTALL.txt
          ditto -c -k --keepParent dist KoolaidMan-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KoolaidMan-macOS
          path: KoolaidMan-macOS.zip

  linux-tests:
    name: Linux build + tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxext-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DKOOLAID_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Engine tests (48 kHz)
        run: ./build/KoolaidTests_artefacts/Release/KoolaidTests "$PWD/test-wavs"
      - name: Engine tests (44.1 kHz and 96 kHz)
        run: |
          ./build/KoolaidTests_artefacts/Release/KoolaidTests - 44100
          ./build/KoolaidTests_artefacts/Release/KoolaidTests - 96000
      - name: Host tests (VST3 load, transport sync, capture, state, export)
        run: |
          cp "test-wavs/preset - Init (Clean).wav" beat.wav
          xvfb-run -a ./build/KoolaidHostTest_artefacts/Release/KoolaidHostTest \
            "$PWD/build/KoolaidMan_artefacts/Release/VST3/Koolaid Man.vst3" beat.wav
      - name: UI snapshot
        run: xvfb-run -a ./build/KoolaidSnapshot_artefacts/Release/KoolaidSnapshot snapshot.png beat.wav 1.0
      - uses: actions/upload-artifact@v4
        with:
          name: KoolaidMan-UI-snapshot
          path: snapshot.png
